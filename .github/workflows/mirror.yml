name: Mirror Plezy APKs

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mirror.yml

permissions:
  contents: write
  attestations: read

concurrency:
  group: mirror

env:
  UPSTREAM: edde746/plezy
  ABIS: arm64-v8a armeabi-v7a x86_64
  # SHA-256 of the certificate edde746 signs Plezy APKs with (read from 2.21.0).
  SIGNING_CERT_SHA256: 903b862cf5e3a0bfbad9b5e049ec3de703f83422bba9c5559a7b019716316e72

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find upstream release
        id: upstream
        run: |
          set -euo pipefail
          tag=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already mirrored"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download, verify and extract
        if: steps.upstream.outputs.new == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          mkdir -p dl apks
          # Prints the SHA-256 of each signer certificate in the APK's v2/v3 signing block.
          cat > cert_sha256.py <<'EOF'
          import hashlib, struct, sys

          def lp(b, o):
              n = struct.unpack_from('<I', b, o)[0]
              return b[o + 4:o + 4 + n], o + 4 + n

          with open(sys.argv[1], 'rb') as f:
              f.seek(0, 2)
              size = f.tell()
              f.seek(max(0, size - 65557))
              tail = f.read()
              cd_off = struct.unpack_from('<I', tail, tail.rfind(b'PK\x05\x06') + 16)[0]
              f.seek(cd_off - 24)
              block_size, magic = struct.unpack('<Q16s', f.read(24))
              assert magic == b'APK Sig Block 42', 'no APK signing block'
              f.seek(cd_off - block_size - 8)
              block = f.read(block_size + 8)

          certs = set()
          p = 8
          while p < len(block) - 24:
              n, pair_id = struct.unpack_from('<QI', block, p)
              value = block[p + 12:p + 8 + n]
              p += 8 + n
              if pair_id in (0x7109871a, 0xf05368c0, 0x1b93ad61):  # v2, v3, v3.1
                  signers, _ = lp(value, 0)
                  o = 0
                  while o < len(signers):
                      signer, o = lp(signers, o)
                      signed_data, _ = lp(signer, 0)
                      _, co = lp(signed_data, 0)
                      cert_seq, _ = lp(signed_data, co)
                      cert, _ = lp(cert_seq, 0)
                      certs.add(hashlib.sha256(cert).hexdigest())
          print('\n'.join(sorted(certs)))
          EOF
          for abi in $ABIS; do
            tarball="dl/plezy-android-$abi.tar.gz"
            gh release download "$TAG" -R "$UPSTREAM" -p "plezy-android-$abi.tar.gz" -D dl
            # Proves the tarball came out of upstream's own release workflow.
            gh attestation verify "$tarball" -R "$UPSTREAM" \
              --signer-workflow "$UPSTREAM/.github/workflows/build.yml"
            tar -xzf "$tarball" -C dl plezy.apk
            apk="apks/plezy-android-$abi.apk"
            mv dl/plezy.apk "$apk"
            # Fails the run if the APK's signature is invalid.
            "${build_tools}apksigner" verify --print-certs "$apk"
            certs=$(python3 cert_sha256.py "$apk")
            if [ "$certs" != "$SIGNING_CERT_SHA256" ]; then
              echo "::error::$apk is signed by '$certs', expected $SIGNING_CERT_SHA256"
              exit 1
            fi
            echo "$abi verified"
          done
          sha256sum apks/*.apk

      - name: Publish release
        if: steps.upstream.outputs.new == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          # A commit per new release counts as repo activity, so GitHub doesn't
          # disable this schedule after 60 quiet days.
          echo "$TAG" > LATEST
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST
          if ! git diff --cached --quiet; then
            git commit -m "Mirror $TAG"
            git push
          fi
          {
            echo "Unmodified APKs from [$UPSTREAM $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG); build attestation and signing certificate verified."
            echo
            gh release view "$TAG" -R "$UPSTREAM" --json body -q .body
          } > notes.md
          gh release create "$TAG" apks/*.apk -R "$GITHUB_REPOSITORY" \
            --title "Plezy $TAG" --notes-file notes.md --target "$(git rev-parse HEAD)" --latest
